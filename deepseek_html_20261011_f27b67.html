async function extractRubricCriteria(workId, rubricId, supportIds) {
  const rubricFile = state.files.find((f) => f.id === rubricId);
  const rubricChunks = await idbByIdx('chunks', 'fileId', rubricId);
  const rubricText = rubricChunks.map((c) => c.text).join('\n\n').slice(0, 22000);

  openModal({
    title: 'Extracting rubric criteria…',
    body: '<div style="text-align:center;padding:30px"><span class="spinner" role="status" aria-label="Extracting"></span>' +
      '<div class="hint" style="margin-top:10px">Reading ' + esc(rubricFile.name) + '…</div></div>',
    footer: '',
  });

  const sys = 'You extract assessment rubrics verbatim. Return ONLY valid JSON, no prose, no markdown fences.';
  const user = 'Extract every assessment criterion from the rubric text below.\nReturn a JSON object:\n\n' +
    '{\n  "criteria": [\n    { "id": "A", "name": "Criterion name", "maxMarks": 8,\n      "bands": [ { "label": "7-8", "descriptor": "verbatim text of this band" } ] }\n  ],\n  "totalMarks": 40,\n  "sourceQuote": "one verbatim sentence proving the total"\n}\n\n' +
    'Rules:\n- Do NOT invent criteria, names, marks, or descriptors.\n- Copy band descriptors verbatim (trimmed).\n' +
    '- If total not stated, compute it and set sourceQuote to "".\n- If a criterion\'s max marks cannot be determined, set maxMarks to null.\n- Only output the JSON object.\n\nRUBRIC TEXT:\n"""\n' + rubricText + '\n"""';

  let parsed;
  try {
    const raw = await aiChat({ messages: [{ role: 'system', content: sys }, { role: 'user', content: user }],
      stream: false, temperature: 0 });
    const clean = raw.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
    const s = clean.indexOf('{'), e = clean.lastIndexOf('}');
    parsed = JSON.parse(clean.slice(s, e + 1));
  } catch (err) { closeModal(); toast('Could not extract criteria: ' + err.message, 'err', 8000); return; }
  if (!parsed || !Array.isArray(parsed.criteria) || !parsed.criteria.length) {
    closeModal(); toast('Groq returned no criteria. Check the rubric file.', 'err'); return;
  }
  showRubricEditor(workId, rubricId, supportIds, parsed, rubricText);
}
function showRubricEditor(workId, rubricId, supportIds, parsed, rubricText) {
  const workFile = state.files.find((f) => f.id === workId);
  const rubricFile = state.files.find((f) => f.id === rubricId);
  const rows = parsed.criteria.map((c, i) =>
    '<tr data-i="' + i + '">' +
    '<td><input class="rb-id" value="' + esc(c.id || '') + '" style="width:44px" aria-label="Criterion ID"></td>' +
    '<td><input class="rb-name" value="' + esc(c.name || '') + '" aria-label="Criterion name"></td>' +
    '<td><input class="rb-max" type="number" min="0" value="' + (c.maxMarks ?? '') + '" style="width:70px" aria-label="Max marks"></td>' +
    '<td style="max-width:320px"><details><summary>' + (c.bands || []).length + ' band(s)</summary>' +
    (c.bands || []).map((b) => '<div style="margin:6px 0;font-size:12px"><strong>' + esc(b.label) + '</strong> — ' +
      esc((b.descriptor || '').slice(0, 400)) + ((b.descriptor || '').length > 400 ? '…' : '') + '</div>').join('') +
    '</details></td></tr>').join('');
  const computed = parsed.criteria.reduce((n, c) => n + (Number(c.maxMarks) || 0), 0);

  openModal({
    title: 'Rubric assessment — step 2 of 2: review criteria',
    xwide: true,
    body: '<div class="notice">Extracted from <strong>' + esc(rubricFile.name) +
      '</strong>. Correct anything Groq got wrong before scoring — the estimates use what you see here, not a hardcoded scheme.</div>' +
      '<div class="row" style="margin:10px 0"><div class="hint grow">Work: <strong>' + esc(workFile.name) + '</strong>' +
      (supportIds.length ? ' · ' + supportIds.length + ' supporting document(s)' : '') + '</div>' +
      '<div class="hint">Total available: <strong id="rbTotal">' + computed + '</strong> marks' +
      (parsed.sourceQuote ? ' (stated in rubric)' : ' (computed)') + '</div></div>' +
      '<div class="table-scroll"><table class="result-table" id="rbTable"><thead><tr><th>ID</th><th>Name</th><th>Max</th><th>Bands</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' +
      '<div class="field"><label for="rbExtra">Extra instructions (optional)</label>' +
      '<input type="text" id="rbExtra" placeholder="e.g. be strict on sustainability analysis"></div>',
    footer: '<button class="btn" data-close>Cancel</button>' +
      '<button class="btn" id="rbAddRow">+ Add criterion</button>' +
      '<button class="btn" id="rbSave">Save criteria</button>' +
      '<button class="btn primary" id="rbRun">Run assessment</button>',
    onMount: (body, foot) => {
      const tbody = body.querySelector('#rbTable tbody');
      const recompute = () => {
        let n = 0; tbody.querySelectorAll('.rb-max').forEach((i) => { n += Number(i.value) || 0; });
        body.querySelector('#rbTotal').textContent = n;
      };
      tbody.addEventListener('input', recompute);
      foot.querySelector('#rbAddRow').onclick = () => {
        tbody.insertAdjacentHTML('beforeend',
          '<tr><td><input class="rb-id" value="" aria-label="Criterion ID"></td><td><input class="rb-name" value="" aria-label="Criterion name"></td>' +
          '<td><input class="rb-max" type="number" min="0" value="0" style="width:70px" aria-label="Max marks"></td>' +
          '<td><details><summary>0 bands</summary></details></td></tr>');
        recompute();
      };
      const collect = () => {
        const out = [];
        tbody.querySelectorAll('tr').forEach((tr, i) => {
          const id = tr.querySelector('.rb-id')?.value.trim() || String(i + 1);
          const name = tr.querySelector('.rb-name')?.value.trim();
          const maxMarks = Number(tr.querySelector('.rb-max')?.value) || 0;
          if (!name || maxMarks <= 0) return;
          const orig = parsed.criteria[i] || {};
          out.push({ id, name, maxMarks, bands: orig.bands || [] });
        });
        return out;
      };
      foot.querySelector('#rbSave').onclick = async () => {
        const criteria = collect();
        if (!criteria.length) { toast('No valid criteria', 'warn'); return; }
        const report = { id: uid('report'), workspaceId: state.workspaceId, type: 'rubric-criteria',
          title: 'Rubric criteria — ' + rubricFile.name, createdAt: Date.now(),
          data: { workId, rubricId, supportIds, criteria, rubricText: rubricText.slice(0, 40000) } };
        await idbPut('reports', report);
        state.reports.push(report); renderReports();
        toast('Criteria saved', 'ok');
      };
      foot.querySelector('#rbRun').onclick = async () => {
        const criteria = collect();
        if (!criteria.length) { toast('Add at least one criterion with marks', 'warn'); return; }
        const extra = body.querySelector('#rbExtra').value.trim();
        closeModal();
        await runRubricAssessment({ workId, rubricId, supportIds, criteria, extra, rubricFile, workFile });
      };
    },
  });
}
async function runRubricAssessment({ workId, rubricId, supportIds, criteria, extra, rubricFile, workFile }) {
  await createConversation('Rubric assessment — ' + workFile.name, true);
  const results = []; let totalMax = 0, totalEst = 0;

  openModal({
    title: 'Running assessment…',
    body: '<div style="text-align:center;padding:30px"><span class="spinner" role="status" aria-label="Assessing"></span>' +
      '<div class="hint" style="margin-top:10px" id="rbProgress">Criterion 1 of ' + criteria.length + '…</div></div>',
    footer: '',
  });

  for (let i = 0; i < criteria.length; i++) {
    const c = criteria[i];
    totalMax += c.maxMarks;
    const progEl = document.querySelector('#rbProgress');
    if (progEl) progEl.textContent = 'Criterion ' + (i + 1) + ' of ' + criteria.length + ': ' + c.name + '…';
    const query = c.name + ' ' + (c.bands || []).map((b) => b.descriptor).join(' ').slice(0, 500);
    const evidence = await retrieveForAssessment(query, {
      fileIds: [workId, ...supportIds],
      topK: Math.max(8, settings.topK),
    });
    const evBlock = evidence.length
      ? evidence.map((s, idx) => '[E' + (idx + 1) + '] ' + s.fileName + (s.page != null ? ' page ' + s.page : '') +
          (s.section ? ' (' + s.section + ')' : '') + '\n"""\n' + s.text + '\n"""').join('\n\n')
      : '(No relevant passages were retrieved for this criterion.)';
    const bandText = (c.bands || []).map((b) => 'BAND ' + b.label + ':\n' + b.descriptor).join('\n\n') ||
      '(No band descriptors extracted — estimate from the criterion name and max marks.)';

    const sys = 'You are a strict, evidence-bound assessor. You never invent evidence, page numbers, or quotes. You only reason from the material supplied. Return ONLY valid JSON.';
    const user = 'Assess the student\'s work against ONE rubric criterion.\n\n' +
      'CRITERION\nID: ' + c.id + '\nName: ' + c.name + '\nMaximum marks: ' + c.maxMarks + '\n\n' +
      'RUBRIC BANDS (verbatim from the markscheme)\n' + bandText + '\n\n' +
      'STUDENT EVIDENCE (retrieved from "' + workFile.name + '"' + (supportIds.length ? ' and supporting documents' : '') + ')\n' + evBlock + '\n\n' +
      (extra ? 'EXTRA INSTRUCTIONS: ' + extra + '\n\n' : '') +
      'Return ONLY this JSON object (no markdown fences, no prose):\n\n' +
      '{\n  "estimatedMarks": <number between 0 and ' + c.maxMarks + '>,\n  "rangeLow": <number>,\n  "rangeHigh": <number>,\n' +
      '  "explanation": "2-5 sentences explaining why this mark, referencing specific evidence",\n' +
      '  "strengths": ["…", "…"],\n  "weaknesses": ["…", "…"],\n' +
      '  "improvements": ["concrete, specific next step", "…"],\n' +
      '  "evidenceUsed": [ { "tag": "E1", "quote": "exact sentence copied from the evidence block above" } ],\n' +
      '  "uncertainty": "what you could not verify from the supplied evidence"\n}\n\n' +
      'Rules:\n- estimatedMarks must be within 0 and ' + c.maxMarks + '.\n- rangeLow ≤ estimatedMarks ≤ rangeHigh.\n' +
      '- Every quote in evidenceUsed must appear verbatim in the STUDENT EVIDENCE block above.\n' +
      '- If the evidence block is empty or unrelated, set estimatedMarks to 0 and explain the absence in "uncertainty".\n' +
      '- Never invent a page number or quotation.';

    let result;
    try {
      const raw = await aiChat({ messages: [{ role: 'system', content: sys }, { role: 'user', content: user }],
        stream: false, temperature: 0 });
      const clean = raw.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
      const s = clean.indexOf('{'), e = clean.lastIndexOf('}');
      result = JSON.parse(clean.slice(s, e + 1));
    } catch (err) {
      result = { estimatedMarks: 0, rangeLow: 0, rangeHigh: 0,
        explanation: 'Assessment failed for this criterion.', strengths: [], weaknesses: [],
        improvements: [], evidenceUsed: [], uncertainty: err.message };
    }
    result.estimatedMarks = clamp(Number(result.estimatedMarks) || 0, 0, c.maxMarks);
    result.rangeLow = clamp(Number(result.rangeLow) || 0, 0, c.maxMarks);
    result.rangeHigh = clamp(Number(result.rangeHigh) || 0, 0, c.maxMarks);
    if (result.rangeLow > result.estimatedMarks) result.rangeLow = result.estimatedMarks;
    if (result.rangeHigh < result.estimatedMarks) result.rangeHigh = result.estimatedMarks;

    const evText = evidence.map((e) => e.text).join(' \n ');
    const norm = (s) => s.replace(/\s+/g, ' ').toLowerCase();
    result.evidenceUsed = (result.evidenceUsed || []).filter((eu) => {
      const q = String(eu.quote || '').trim();
      if (q.length < 8) return false;
      return norm(evText).includes(norm(q).slice(0, Math.min(80, q.length)));
    });
    totalEst += result.estimatedMarks;
    results.push({ criterion: c, result, evidence });
  }

  const report = { id: uid('report'), workspaceId: state.workspaceId, type: 'rubric-assessment',
    title: 'Assessment — ' + workFile.name + ' vs ' + rubricFile.name, createdAt: Date.now(),
    data: {
      workFile: workFile.name, rubricFile: rubricFile.name,
      criteria: results.map((r) => Object.assign({ id: r.criterion.id, name: r.criterion.name, maxMarks: r.criterion.maxMarks },
        r.result, { evidence: r.evidence.map((e) => ({ n: e.n, fileName: e.fileName, page: e.page, section: e.section, text: e.text })) })),
      totalEstimated: totalEst, totalMax,
    } };
  await idbPut('reports', report);
  state.reports.push(report); renderReports();
  closeModal();
  showAssessmentReport(report);
}
function showAssessmentReport(report) {
  const d = report.data;
  const pct = d.totalMax ? Math.round((d.totalEstimated / d.totalMax) * 100) : 0;
  const critHtml = d.criteria.map((c, i) => {
    const rangeText = (c.rangeLow !== c.rangeHigh) ? ' (' + c.rangeLow + '–' + c.rangeHigh + ')' : ' (point estimate)';
    return '<div class="crit-block ' + (i === 0 ? 'open' : '') + '">' +
      '<button class="crit-head" type="button" aria-expanded="' + (i === 0 ? 'true' : 'false') + '">' +
      '<span class="src-n">' + esc(c.id) + '</span>' +
      '<span class="cn">' + esc(c.name) + '</span>' +
      '<span class="crit-mark">' + c.estimatedMarks + ' / ' + c.maxMarks + rangeText + '</span>' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>' +
      '</button>' +
      '<div class="crit-body"><h5>Explanation</h5><div>' + esc(c.explanation) + '</div>' +
      (c.strengths?.length ? '<h5>Strengths</h5><ul>' + c.strengths.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ul>' : '') +
      (c.weaknesses?.length ? '<h5>Weaknesses</h5><ul>' + c.weaknesses.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ul>' : '') +
      (c.improvements?.length ? '<h5>Recommended improvements</h5><ul>' + c.improvements.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ul>' : '') +
      (c.evidenceUsed?.length
        ? '<h5>Cited evidence from the student\'s work</h5>' + c.evidenceUsed.map((e) => {
            const src = (c.evidence || []).find((x) => 'E' + x.n === e.tag);
            const loc = src ? src.fileName + (src.page != null ? ', page ' + src.page : '') + (src.section ? ', ' + src.section : '') : e.tag;
            return '<div class="ev-quote"><span class="lbl">' + esc(loc) + '</span>' + esc(e.quote) + '</div>';
          }).join('')
        : '<div class="ev-quote ev-unverified"><span class="lbl">No verified quotes</span>Groq did not supply quotes that could be matched verbatim against the retrieved evidence.</div>') +
      (c.uncertainty ? '<h5>Uncertainty</h5><div class="hint">' + esc(c.uncertainty) + '</div>' : '') +
      '</div></div>';
  }).join('');

  openModal({
    title: 'Rubric assessment', xwide: true,
    body: '<div class="notice warn"><strong>This is an estimate.</strong> Generated by Groq from your uploaded rubric and evidence retrieved from your documents. It is <strong>not an official grade</strong>.</div>' +
      '<div class="row" style="margin:12px 0 18px;gap:20px;flex-wrap:wrap">' +
      '<div><div class="hint">Work</div><div style="font-weight:650">' + esc(d.workFile) + '</div></div>' +
      '<div><div class="hint">Rubric</div><div style="font-weight:650">' + esc(d.rubricFile) + '</div></div>' +
      '<div style="margin-left:auto;text-align:right"><div class="hint">Estimated total</div>' +
      '<div style="font-size:22px;font-weight:750;color:var(--accent);font-family:var(--mono)">' +
      d.totalEstimated + ' / ' + d.totalMax + '</div><div class="hint">' + pct + '%</div></div></div>' + critHtml,
    footer: '<div class="left"><button class="btn" id="rbExportMd">Export Markdown</button>' +
      '<button class="btn" id="rbExportJson">Export JSON</button></div>' +
      '<button class="btn primary" data-close>Close</button>',
    onMount: (body, foot) => {
      body.addEventListener('click', (e) => {
        const head = e.target.closest('.crit-head');
        if (!head) return;
        const block = head.parentElement;
        const open = block.classList.toggle('open');
        head.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      foot.querySelector('#rbExportMd').onclick = () => exportAssessmentMarkdown(report);
      foot.querySelector('#rbExportJson').onclick = () =>
        downloadFile(report.title.replace(/\s+/g, '_') + '.json', JSON.stringify(report, null, 2), 'application/json');
    },
  });
}

/* ================= EXPORTS ================= */
function exportAssessmentMarkdown(report) {
  const d = report.data;
  const pct = d.totalMax ? Math.round((d.totalEstimated / d.totalMax) * 100) : 0;
  const lines = ['# Rubric Assessment — ' + d.workFile, '',
    '**Rubric:** ' + d.rubricFile,
    '**Generated:** ' + new Date(report.createdAt).toLocaleString(),
    '**Estimated total:** ' + d.totalEstimated + ' / ' + d.totalMax + ' (' + pct + '%)', '',
    '> This is a reasoned estimate produced by Contextly using Groq from the uploaded rubric and retrieved evidence. It is not an official grade.', ''];
  for (const c of d.criteria) {
    lines.push('## ' + c.id + ' — ' + c.name + ' (' + c.estimatedMarks + ' / ' + c.maxMarks + ')');
    if (c.rangeLow !== c.rangeHigh) lines.push('*Estimated range: ' + c.rangeLow + '–' + c.rangeHigh + '*');
    else lines.push('*Point estimate*');
    lines.push('', c.explanation || '', '');
    if (c.strengths?.length) { lines.push('**Strengths**'); c.strengths.forEach((s) => lines.push('- ' + s)); lines.push(''); }
    if (c.weaknesses?.length) { lines.push('**Weaknesses**'); c.weaknesses.forEach((s) => lines.push('- ' + s)); lines.push(''); }
    if (c.improvements?.length) { lines.push('**Recommended improvements**'); c.improvements.forEach((s) => lines.push('- ' + s)); lines.push(''); }
    if (c.evidenceUsed?.length) {
      lines.push('**Cited evidence**');
      for (const e of c.evidenceUsed) {
        const src = (c.evidence || []).find((x) => 'E' + x.n === e.tag);
        const loc = src ? src.fileName + (src.page != null ? ', p.' + src.page : '') + (src.section ? ', ' + src.section : '') : e.tag;
        lines.push('- *' + loc + '*: "' + e.quote + '"');
      }
      lines.push('');
    }
    if (c.uncertainty) lines.push('**Uncertainty:** ' + c.uncertainty, '');
  }
  downloadFile(report.title.replace(/\s+/g, '_') + '.md', lines.join('\n'), 'text/markdown;charset=utf-8');
}
function exportChatTranscript() {
  if (!state.messages.length) { toast('No messages to export', 'warn'); return; }
  const conv = state.conversations.find((c) => c.id === state.currentConvId);
  const lines = ['# ' + (conv?.title || 'Conversation'), '_Exported ' + new Date().toLocaleString() + '_', ''];
  for (const m of state.messages) {
    if (m.pending && !m.content) continue;
    lines.push(m.role === 'user' ? '## You' : '## Contextly', '', m.content || '', '');
    if (m.sources?.length) {
      lines.push('**Sources**');
      m.sources.forEach((s) => lines.push('- [S' + s.n + '] ' + s.fileName +
        (s.page != null ? ', page ' + s.page : '') + (s.section ? ', ' + s.section : '')));
      lines.push('');
    }
  }
  downloadFile((conv?.title || 'conversation').replace(/\s+/g, '_') + '.md', lines.join('\n'), 'text/markdown;charset=utf-8');
}
async function exportWorkspace() {
  const data = { exportedAt: new Date().toISOString(), workspace: state.workspace,
    provider: { name: 'Groq', model: ENV.GROQ_MODEL },
    files: state.files.map((f) => ({ id: f.id, name: f.name, ext: f.ext, size: f.size, status: f.status, chunkCount: f.chunkCount })),
    conversations: state.conversations, reports: state.reports,
    settings: { topK: settings.topK, temperature: settings.temperature } };
  downloadFile('contextly-workspace-' + (state.workspace?.name?.replace(/\W+/g, '_') || 'export') + '.json',
    JSON.stringify(data, null, 2), 'application/json');
}

/* ================= SAVED REPORT VIEWER ================= */
function openSavedReport(r) {
  if (!r) return;
  if (r.type === 'rubric-assessment') return showAssessmentReport(r);
  if (r.type === 'rubric-criteria') {
    const crit = r.data.criteria || [];
    const rows = crit.map((c) =>
      '<tr><td>' + esc(c.id) + '</td><td>' + esc(c.name) + '</td><td>' + esc(c.maxMarks) + '</td>' +
      '<td>' + ((c.bands || []).length) + ' band(s)</td></tr>').join('');
    const total = crit.reduce((n, c) => n + (Number(c.maxMarks) || 0), 0);
    openModal({
      title: r.title, wide: true,
      body: '<div class="hint" style="margin-bottom:8px">Saved rubric criteria · total ' + total + ' marks</div>' +
        '<div class="table-scroll"><table class="result-table"><thead><tr><th>ID</th><th>Name</th><th>Max</th><th>Bands</th></tr></thead><tbody>' +
        rows + '</tbody></table></div>',
      footer: '<div class="left"><button class="btn" id="critExportJson">Export JSON</button></div>' +
        '<button class="btn primary" data-close>Close</button>',
      onMount: (body, foot) => {
        foot.querySelector('#critExportJson').onclick = () =>
          downloadFile(r.title.replace(/\s+/g, '_') + '.json', JSON.stringify(r, null, 2), 'application/json');
      },
    });
    return;
  }
  openModal({ title: r.title, wide: true,
    body: '<pre class="code">' + esc(JSON.stringify(r.data, null, 2)) + '</pre>',
    footer: '<button class="btn" data-close>Close</button>' });
}

/* ================= EVENT WIRING ================= */
function openSidebar(open) {
  $('#leftPanel').classList.toggle('open', open);
  $('#scrim').classList.toggle('open', open);
}
function openRightPanel(open) {
  $('#rightPanel').classList.toggle('open', open);
  $('#btnCloseRight').style.display = open ? 'grid' : 'none';
  if (window.innerWidth <= 1180) $('#scrim').classList.toggle('open', open);
}
function wireEvents() {
  $('#btnToggleLeft').onclick = () => openSidebar(!$('#leftPanel').classList.contains('open'));
  $('#btnToggleRight').onclick = () => openRightPanel(!$('#rightPanel').classList.contains('open'));
  $('#btnCloseRight').onclick = () => openRightPanel(false);
  $('#scrim').onclick = () => { openSidebar(false); openRightPanel(false); };
  $('#btnTheme').onclick = () => { settings.theme = settings.theme === 'dark' ? 'light' : 'dark'; saveSettings(); };
  applyTheme();
  $('#btnSettings').onclick = openSettings;
  $('#btnTools').onclick = openTools;

  $('#wsSelect').onchange = (e) => switchWorkspace(e.target.value);
  $('#btnNewWs').onclick = createWorkspace;
  $('#btnRenameWs').onclick = renameWorkspace;
  $('#btnDeleteWs').onclick = deleteWorkspace;

  const dz = $('#dropzone');
  dz.addEventListener('click', () => $('#fileInput').click());
  $('#fileInput').addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });

  ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation(); dz.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation(); dz.classList.remove('over');
  }));
  dz.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    if (dt && dt.files && dt.files.length) handleFiles(dt.files);
  });
  ['dragover', 'drop'].forEach((ev) => window.addEventListener(ev, (e) => e.preventDefault()));
  window.addEventListener('drop', (e) => {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });

  $('#fileList').addEventListener('click', (e) => {
    const item = e.target.closest('.file-item');
    if (!item) return;
    const fid = item.dataset.fid;
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'remove') return removeFile(fid);
    if (act === 'retry') return retryFile(fid);
    if (act === 'open') return openFileViewer(fid);
    if (act === 'error') return openErrorDetails(fid);
    if (e.target.tagName === 'INPUT') return;
    if (state.selectedFileIds.has(fid)) state.selectedFileIds.delete(fid);
    else state.selectedFileIds.add(fid);
    renderFiles();
  });
  $('#fileList').addEventListener('change', (e) => {
    if (e.target.tagName !== 'INPUT') return;
    const fid = e.target.closest('.file-item').dataset.fid;
    if (e.target.checked) state.selectedFileIds.add(fid);
    else state.selectedFileIds.delete(fid);
    renderFiles();
  });
  $('#btnSelectAll').onclick = () => { state.files.forEach((f) => state.selectedFileIds.add(f.id)); renderFiles(); };
  $('#btnSelectNone').onclick = () => { state.selectedFileIds.clear(); renderFiles(); };

  $('#searchInput').addEventListener('input', runSearch);
  $('#searchResults').addEventListener('click', (e) => {
    const card = e.target.closest('[data-search-fid]');
    if (card) openFileViewer(card.dataset.searchFid, card.dataset.searchChunk);
  });

  $('#btnNewChat').onclick = () => createConversation('New conversation', true);
  const activateConv = (e) => {
    const item = e.target.closest('.conv-item');
    if (!item) return;
    const cid = item.dataset.cid;
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'rename') return renameConversation(cid);
    if (act === 'delete') return deleteConversation(cid);
    openConversation(cid);
  };
  $('#convList').addEventListener('click', activateConv);
  $('#convList').addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('conv-item')) {
      e.preventDefault(); activateConv(e);
    }
  });

  const reportClick = async (e) => {
    const item = e.target.closest('.conv-item');
    if (!item) return;
    const rid = item.dataset.rid;
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'delete-report') {
      const ok = await uiConfirm('Delete this report?', { title: 'Delete report', okLabel: 'Delete' });
      if (!ok) return;
      await idbDel('reports', rid);
      state.reports = state.reports.filter((r) => r.id !== rid);
      renderReports();
      return;
    }
    openSavedReport(state.reports.find((x) => x.id === rid));
  };
  $('#reportList').addEventListener('click', reportClick);
  $('#reportList').addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('conv-item')) {
      e.preventDefault(); reportClick(e);
    }
  });

  $$('.tabs .tab').forEach((t) => t.addEventListener('click', () => {
    $$('.tabs .tab').forEach((x) => { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });
    t.classList.add('active');
    t.setAttribute('aria-selected', 'true');
    $('#rightBody').setAttribute('aria-labelledby', t.id);
    state.rightTab = t.dataset.rtab;
    renderRightPanel();
  }));
  $('#rightBody').addEventListener('click', (e) => {
    const card = e.target.closest('[data-cite]');
    if (!card) return;
    const n = parseInt(card.dataset.cite, 10);
    const src = state.lastSources.find((s) => s.n === n);
    if (src) openFileViewer(src.fileId, src.chunkId);
  });

  const ta = $('#composerInput');
  ta.addEventListener('input', () => autoGrow(ta));
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $('#btnSend').onclick = () => {
    if (state.streaming) { state.streaming.abort(); toast('Stopped', 'warn', 2000); }
    else sendMessage();
  };
  $('#btnExportChat').onclick = exportChatTranscript;
  $('#btnClearChat').onclick = async () => {
    if (!state.currentConvId || !state.messages.length) return;
    const ok = await uiConfirm('Clear all messages in this conversation?', { title: 'Clear conversation', okLabel: 'Clear' });
    if (!ok) return;
    for (const m of state.messages) await idbDel('messages', m.id);
    state.messages = []; state.lastSources = [];
    renderMessages(); renderRightPanel();
  };

  $('#msgs').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (btn) {
      const m = state.messages.find((x) => x.id === btn.dataset.mid);
      if (!m) return;
      if (btn.dataset.act === 'copy') {
        navigator.clipboard.writeText(m.content || '').then(() => toast('Copied', 'ok', 1500));
      } else if (btn.dataset.act === 'retry') retryMessage(m.id);
      else if (btn.dataset.act === 'show-sources') {
        state.lastSources = m.sources || [];
        renderRightPanel();
        openRightPanel(true);
      }
      return;
    }
    const chip = e.target.closest('.cite-chip');
    if (chip) {
      const wrap = chip.closest('.msg-wrap');
      const msg = state.messages.find((x) => x.id === wrap?.dataset.mid);
      const n = parseInt(chip.dataset.cite, 10);
      const src = (msg?.sources || []).find((s) => s.n === n);
      if (src) openFileViewer(src.fileId, src.chunkId);
    }
  });
  $('#msgs').addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('cite-chip')) {
      e.preventDefault();
      e.target.click();
    }
  });

  document.body.addEventListener('click', (e) => {
    const card = e.target.closest('[data-tool]');
    if (card) {
      const tool = card.dataset.tool;
      if (tool === 'upload') { $('#fileInput').click(); return; }
      if (tool === 'settings') { openSettings(); return; }
      runTool(tool);
      return;
    }
    const sug = e.target.closest('[data-prompt]');
    if (sug) sendMessage(sug.dataset.prompt);
    const newWs = e.target.closest('#welcomeNewWs');
    if (newWs) createWorkspace();
  });

  $('#modalClose').onclick = () => closeModal();
  $('#backdrop').addEventListener('click', (e) => { if (e.target.id === 'backdrop') closeModal(); });
  document.addEventListener('click', (e) => { if (e.target.matches('[data-close]')) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if ($('#backdrop').classList.contains('open')) closeModal();
      else { openSidebar(false); openRightPanel(false); }
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault(); $('#searchInput').focus();
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (state.streaming) { e.preventDefault(); e.returnValue = ''; }
  });
}

/* ================= INIT ================= */
async function init() {
  // .env.js is loaded synchronously via <script src=".env.js"> in <head>,
  // so window.GROQ_API_KEY / GROQ_BASE_URL / GROQ_MODEL are already set
  // on `window` by the time this script runs. No server, no fetch, no CORS.

  // Reveal the app.
  const app = $('#app');
  if (app) app.hidden = false;

  // Open the database.
  try { db = await openDB(); }
  catch (e) {
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="padding:20px;background:#fee;color:#900;font-family:sans-serif;font-size:13px">' +
      '<strong>IndexedDB could not be opened.</strong><br>' + esc(e.message) +
      '<br>Contextly needs IndexedDB to store files locally. Try a non-private window.</div>');
    return;
  }

  // Wire everything up.
  wireEvents();
  renderAIStatus();
  await loadWorkspaces();
  $('#composerInput').focus();

  if (!providerConfigured()) {
    toast('Groq key not configured — check .env.js next to index.html', 'err', 8000);
  }
  console.info('%cContextly ready · Groq ' + ENV.GROQ_MODEL, 'color:#4f46e5;font-weight:bold');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
